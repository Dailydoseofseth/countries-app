name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: version-4/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: version-4/client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  server:
    name: Server (install + syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: version-4/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: version-4/server/package-lock.json
      - run: npm ci
      - run: node --check src/index.js
      - run: node --check src/logger.js
